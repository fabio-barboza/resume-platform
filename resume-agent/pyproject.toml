[project]
name = "resume-agent"
version = "0.1.0"
description = "Agente RAG de currículos (Postgres/pgvector + LangChain + Langfuse)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.16.0",
    "fastapi>=0.121.0",
    "langchain>=1.3.14",
    "langchain-core>=1.4.9",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langfuse>=4.14.0",
    "boto3>=1.35.0",
    "langgraph>=1.2.9",
    "pgvector>=0.4.1",
    "psycopg[binary]>=3.2.0",
    "pydantic>=2.13.4",
    "pypdf>=6.14.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.36",
    "uvicorn[standard]>=0.38.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/resume_agent"]
