services:
  pgvector:
    image: pgvector/pgvector:pg18
    container_name: resume-agent-pgvector
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      # PG18 mudou o PGDATA para /var/lib/postgresql/18/docker — o volume
      # precisa cobrir /var/lib/postgresql, não o antigo .../data.
      - pgvector_data:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-resume_agent}
      POSTGRES_USER: ${POSTGRES_USER:-resume_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-resume_agent}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-resume_agent} -d ${POSTGRES_DB:-resume_agent}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: resume-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio123}
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgvector_data:
  minio_data:
